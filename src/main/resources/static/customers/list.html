<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .loading-spinner-container { display: none; justify-content: center; align-items: center; padding: 40px 0; }
        .table th, .table td { vertical-align: middle; }
        .action-buttons a, .action-buttons button { margin-right: 0.25rem; }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1>Danh sách Khách hàng</h1>

<!--        // Thêm mới khách hàng-->
        <a href="/customers/form.html" class="btn btn-primary"> <i class="bi bi-plus-circle"></i> Thêm mới Khách hàng</a>
    </div>

    <div id="globalMessages" class="mb-3"></div>

    <div id="loadingSpinner" class="loading-spinner-container">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Đang tải...</span></div>
    </div>

    <form id="searchCustomerForm" class="mb-4">
        <div class="input-group">
            <input type="text" class="form-control" name="keyword" id="customerKeywordInput" placeholder="Tìm kiếm theo tên khách hàng...">
            <button class="btn btn-outline-secondary" type="submit" id="searchButton"><i class="bi bi-search"></i> Tìm kiếm</button>
            <button class="btn btn-outline-info" type="button" id="showAllCustomersButton" title="Hiển thị tất cả"><i class="bi bi-list-ul"></i></button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Họ tên</th>
                <th scope="col">Email</th>
                <th scope="col">Số điện thoại</th>
                <th scope="col">Địa chỉ</th>
                <th scope="col">Ngày ĐK</th>
                <th scope="col" style="width: 120px;">Hành động</th> </tr>
            </thead>
            <tbody id="customerTableBody">
            </tbody>
        </table>
        <p id="noCustomersMessage" class="text-center text-muted py-3" style="display: none;">Không tìm thấy khách hàng nào.</p>
    </div>
</main>

<div id="footer-placeholder" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const customerTableBody = document.getElementById('customerTableBody');
        const searchCustomerForm = document.getElementById('searchCustomerForm');
        const customerKeywordInput = document.getElementById('customerKeywordInput');
        const showAllCustomersButton = document.getElementById('showAllCustomersButton');

        function renderCustomerRow(customer) {
            const row = customerTableBody.insertRow();
            row.insertCell().textContent = customer.id;
            row.insertCell().textContent = customer.fullName || '';
            row.insertCell().textContent = customer.email || '';
            row.insertCell().textContent = customer.phoneNumber || '';
            row.insertCell().textContent = customer.address || '';
            row.insertCell().textContent = customer.registrationDate ? formatLocalDateTime(customer.registrationDate) : 'N/A';

            const actionsCell = row.insertCell();
            actionsCell.classList.add('action-buttons');
            // Sửa, Xoá khách hàng
            actionsCell.innerHTML = `
                <a href="/customers/form.html?id=${customer.id}" class="btn btn-sm btn-warning" title="Sửa">
                    <i class="bi bi-pencil-square"></i>
                </a>
                <button class="btn btn-sm btn-danger delete-customer-btn" data-id="${customer.id}" data-name="${customer.fullName || ''}" title="Xóa">
                    <i class="bi bi-trash3"></i>
                </button>
            `;
            // Xoá khách hàng
            actionsCell.querySelector('.delete-customer-btn').addEventListener('click', handleDeleteButtonClick);
        }

        function handleDeleteButtonClick(event) {
            const button = event.currentTarget;
            const customerId = button.dataset.id;
            const customerName = button.dataset.name;
            handleDeleteCustomer(customerId, customerName);
        }

        // Lấy danh sách khách hàng
        async function fetchAndDisplayCustomers(url = '/admin/customers') {
            showLoading(true);
            customerTableBody.innerHTML = '';
            searchCustomerForm.dataset.lastUrl = url;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    let errorMsg = `Lỗi HTTP: ${response.status} ${response.statusText}`;
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData?.message || errorMsg;
                    } catch (e) { }
                    throw new Error(errorMsg);
                }

                const customers = await response.json();

                if (customers && Array.isArray(customers)) {
                    customers.forEach(customer => {
                        if (customer && customer.id) {
                            renderCustomerRow(customer);
                        }
                    });
                } else {
                    console.warn("Dữ liệu khách hàng nhận được không phải là một mảng hoặc không có: ", customers);
                }

            } catch (error) {
                console.error('Lỗi khi tải khách hàng:', error);
                displayGlobalMessage('Lỗi tải danh sách khách hàng: ' + error.message, 'danger', 'globalMessages');
            } finally {
                showLoading(false);
                customerTableBody.style.display = '';
            }
        }

        // Xoá khách hàng
        async function handleDeleteCustomer(customerId, customerName) {
            if (!confirm(`Bạn có chắc chắn muốn xóa khách hàng "${customerName || 'N/A'}" (ID: ${customerId})?\nHành động này không thể hoàn tác.`)) {
                return;
            }
            showLoading(true);

            const deleteUrl = `/admin/customers/${customerId}`;
            try {
                const response = await fetch(deleteUrl, {
                    method: 'DELETE'
                });
                if (!response.ok) {
                    let errorMsg = `Lỗi xóa khách hàng (HTTP ${response.status})`;
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData?.message || (response.statusText || errorMsg) ;
                    } catch (e) {
                        errorMsg = response.statusText || errorMsg;
                    }
                    throw new Error(errorMsg);
                }
                const result = await response.json();
                displayGlobalMessage(result.message || `Đã xóa thành công khách hàng ID ${customerId}.`, 'success', 'globalMessages');
                fetchAndDisplayCustomers(searchCustomerForm.dataset.lastUrl || '/admin/customers'); // Tải lại danh sách
            } catch (error) {
                console.error('Lỗi khi xóa khách hàng:', error);
                displayGlobalMessage('Lỗi khi xóa khách hàng: ' + error.message, 'danger', 'globalMessages');
                showLoading(false);
            }
        }
        // Tìm kiếm khách hàng
        searchCustomerForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const keyword = customerKeywordInput.value.trim();
            const url = keyword ? `/admin/customers?keyword=${encodeURIComponent(keyword)}` : '/admin/customers';
            fetchAndDisplayCustomers(url);
        });

        showAllCustomersButton.addEventListener('click', function() {
            customerKeywordInput.value = '';
            const defaultUrl = '/admin/customers';
            fetchAndDisplayCustomers(defaultUrl);
        });

        fetchAndDisplayCustomers();
    });
</script>
</body>
</html>
