<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="formPageTitle">Thông tin Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .loading-spinner-container { display: none; justify-content: center; align-items: center; padding: 40px 0; }
        .form-label .text-danger { font-size: 1.1em; }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<main class="container mt-4">
    <h1 id="formTitle">Thông tin Khách hàng</h1>
    <hr>

    <div id="globalMessages" class="mb-3"></div>

    <div id="loadingSpinner" class="loading-spinner-container">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Đang tải...</span></div>
    </div>

    <form id="customerForm" novalidate> <input type="hidden" id="customerId"/>

        <div class="row g-3">
            <div class="col-md-6 mb-3">
                <label for="fullName" class="form-label">Họ và tên <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="fullName" required maxlength="100">
                <div class="invalid-feedback" id="fullNameError">Họ tên không được để trống và tối đa 100 ký tự.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" required maxlength="100">
                <div class="invalid-feedback" id="emailError">Email không đúng định dạng, không được để trống và tối đa 100 ký tự.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="phoneNumber" class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="phoneNumber" required pattern="^\d{10,11}$" maxlength="11">
                <div class="invalid-feedback" id="phoneNumberError">Số điện thoại phải có 10 hoặc 11 chữ số.</div>
            </div>

            <div class="col-12 mb-3">
                <label for="address" class="form-label">Địa chỉ</label>
                <textarea class="form-control" id="address" rows="3" maxlength="500"></textarea>
                <div class="invalid-feedback" id="addressError">Địa chỉ tối đa 500 ký tự.</div>
            </div>

            <div class="col-12 mb-3" id="registrationDateDiv" style="display: none;">
                <label class="form-label">Ngày đăng ký</label>
                <input type="text" class="form-control" id="registrationDate" disabled readonly>
            </div>
        </div>

        <hr class="my-4">
        <div class="d-flex justify-content-end">
            <a href="/customers/list.html" class="btn btn-secondary me-2"> <i class="bi bi-x-circle"></i> Hủy bỏ</a>
            <button type="submit" class="btn btn-primary" id="saveCustomerBtn">
                <i class="bi bi-check-circle"></i> Lưu thay đổi
            </button>
        </div>
    </form>
</main>

<div id="footer-placeholder" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const customerForm = document.getElementById('customerForm');
        const formPageTitle = document.getElementById('formPageTitle');
        const formTitle = document.getElementById('formTitle');
        const customerIdInput = document.getElementById('customerId');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const addressInput = document.getElementById('address');
        const registrationDateInput = document.getElementById('registrationDate');
        const registrationDateDiv = document.getElementById('registrationDateDiv');
        const saveCustomerBtn = document.getElementById('saveCustomerBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const currentCustomerId = urlParams.get('id');
        const isEditMode = !!currentCustomerId;

        function populateForm(customer) {
            customerIdInput.value = customer.id;
            fullNameInput.value = customer.fullName || '';
            emailInput.value = customer.email || '';
            phoneNumberInput.value = customer.phoneNumber || '';
            addressInput.value = customer.address || '';
            if (customer.registrationDate) {
                registrationDateInput.value = formatLocalDateTime(customer.registrationDate);
                registrationDateDiv.style.display = 'block';
            } else {
                registrationDateDiv.style.display = 'none';
            }
        }

        async function fetchCustomerDetails() {
            showLoading(true);
            saveCustomerBtn.disabled = true; // Vô hiệu hóa nút lưu khi đang tải dữ liệu
            customerForm.style.display = 'none';
            const apiUrl = `/admin/customers/${currentCustomerId}`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    let errorMsg = `Lỗi HTTP: ${response.status} ${response.statusText}`;
                    if (response.status === 404) {
                        errorMsg = 'Không tìm thấy khách hàng.';
                    } else {
                        try {
                            const errorData = await response.json();
                            errorMsg = errorData?.message || errorMsg;
                        } catch (e) { }
                    }
                    throw new Error(errorMsg);
                }
                const customer = await response.json();
                if (customer && customer.id) {
                    populateForm(customer);
                    customerForm.style.display = 'block';
                    saveCustomerBtn.disabled = false; // Kích hoạt lại nút lưu sau khi tải xong
                } else if (response.ok && !customer) {
                    throw new Error('Không nhận được dữ liệu khách hàng hợp lệ từ máy chủ (dữ liệu null).');
                } else {
                    throw new Error('Dữ liệu khách hàng không hợp lệ (thiếu ID).');
                }
            } catch (error) {
                console.error('Lỗi tải chi tiết khách hàng:', error);
                displayGlobalMessage('Lỗi tải thông tin: ' + error.message, 'danger', 'globalMessages');
                formTitle.textContent = 'Lỗi tải thông tin';
                // Nút lưu vẫn bị disabled do lỗi tải
            } finally {
                showLoading(false);
            }
        }

        function validateForm() {
            let isValid = true;
            customerForm.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));

            if (!fullNameInput.value.trim() || fullNameInput.value.length > 100) {
                fullNameInput.classList.add('is-invalid');
                document.getElementById('fullNameError').textContent = !fullNameInput.value.trim() ? 'Họ tên không được để trống.' : 'Họ tên tối đa 100 ký tự.';
                isValid = false;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailInput.value.trim() || !emailRegex.test(emailInput.value) || emailInput.value.length > 100) {
                emailInput.classList.add('is-invalid');
                document.getElementById('emailError').textContent = !emailInput.value.trim() ? 'Email không được để trống.' : (!emailRegex.test(emailInput.value) ? 'Email không đúng định dạng.' : 'Email tối đa 100 ký tự.');
                isValid = false;
            }
            const phoneRegex = /^\d{10,11}$/;
            if (!phoneNumberInput.value.trim() || !phoneRegex.test(phoneNumberInput.value)) {
                phoneNumberInput.classList.add('is-invalid');
                document.getElementById('phoneNumberError').textContent = !phoneNumberInput.value.trim() ? 'Số điện thoại không được để trống.' : 'Số điện thoại phải có 10 hoặc 11 chữ số.';
                isValid = false;
            }
            if (addressInput.value.trim().length > 500) {
                addressInput.classList.add('is-invalid');
                document.getElementById('addressError').textContent = 'Địa chỉ tối đa 500 ký tự.';
                isValid = false;
            }

            if (!isValid) {
                displayGlobalMessage("Vui lòng kiểm tra lại các trường được đánh dấu đỏ.", "warning", "globalMessages");
            }
            return isValid;
        }

        if (isEditMode) {
            formPageTitle.textContent = 'Sửa thông tin Khách hàng';
            formTitle.textContent = 'Sửa thông tin Khách hàng';
            fetchCustomerDetails();
        } else {
            formPageTitle.textContent = 'Thêm mới Khách hàng';
            formTitle.textContent = 'Thêm mới Khách hàng';
            registrationDateDiv.style.display = 'none';
            customerForm.style.display = 'block';
            // Nút lưu ở chế độ thêm mới nên được kích hoạt
            saveCustomerBtn.disabled = false;
        }

        customerForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            if (!validateForm()) {
                return;
            }

            showLoading(true);
            saveCustomerBtn.disabled = true;

            const customerData = {
                fullName: fullNameInput.value.trim(),
                email: emailInput.value.trim(),
                phoneNumber: phoneNumberInput.value.trim(),
                address: addressInput.value.trim()
            };

            let apiUrl;
            let method;

            if (isEditMode) {
                apiUrl = `/admin/customers/${currentCustomerId}`;
                method = 'PUT';
            } else {
                apiUrl = '/admin/customers';
                method = 'POST';
            }

            try {
                const response = await fetch(apiUrl, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(customerData)
                });

                if (!response.ok) {
                    let errorMsg = `Lỗi HTTP: ${response.status} (${response.statusText || 'Unknown Status'})`;
                    try {
                        const responseData = await response.json();
                        if (responseData && responseData.message) {
                            errorMsg = responseData.message;
                        }
                        if (response.status === 400 && responseData && responseData.errors) {
                            let details = "";
                            if (Array.isArray(responseData.errors)) {
                                details = responseData.errors.map(err => `${err.field || 'Lỗi'}: ${err.defaultMessage || err.code}`).join('<br>');
                            } else if (typeof responseData.errors === 'object') {
                                details = Object.entries(responseData.errors).map(([field, msg]) => `${field}: ${msg}`).join('<br>');
                            }
                            if (details) errorMsg += `<br/>Chi tiết:<br/>${details}`;
                        }
                    } catch (e) {
                        console.warn("Không thể parse lỗi response dưới dạng JSON:", e);
                    }
                    throw new Error(errorMsg);
                }

                // Xử lý thành công
                displayGlobalMessage(isEditMode ? 'Cập nhật thông tin khách hàng thành công!' : 'Thêm mới khách hàng thành công!', 'success', 'globalMessages');

                // Chuyển hướng ngay sau khi báo thành công, không cần chờ lâu
                window.location.href = '/customers/list.html';

                // Không cần kích hoạt lại nút saveCustomerBtn ở đây vì đã chuyển hướng

            } catch (error) {
                console.error('Lỗi khi lưu khách hàng:', error.message);
                displayGlobalMessage('Lỗi khi lưu khách hàng: <br>' + error.message, 'danger', 'globalMessages');
                saveCustomerBtn.disabled = false; // Kích hoạt lại nút LƯU nếu có lỗi
            } finally {
                // showLoading(false) sẽ được gọi ngay cả khi chuyển hướng,
                // nhưng vì chuyển hướng xảy ra nhanh, người dùng có thể không thấy.
                // Điều này là chấp nhận được.
                showLoading(false);
            }
        });
    });
</script>
</body>
</html>
