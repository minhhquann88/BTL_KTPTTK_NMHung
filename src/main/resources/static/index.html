<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thuê xe Online - Giải pháp di chuyển tiện lợi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    /* Custom styles */
    body {
      background-color: #f8f9fa;
    }
    /* CSS cho .hero-section đã được xóa vì section đó không còn */
    .car-card {
      margin-bottom: 1.5rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border-radius: 12px;
      overflow: hidden;
    }
    .car-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
    .car-card .card-img-top {
      object-fit: cover;
      height: 200px;
      width: 100%;
      border-bottom: 1px solid #dee2e6;
    }
    .car-card .card-subtitle {
      font-size: 0.9rem;
    }
    .car-card .car-specs span {
      margin-right: 0.75rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .price-tag {
      background-color: rgba(220, 53, 69, 0.1);
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-block;
    }
    /* filter-card không còn được sử dụng trực tiếp nếu Features Section bị xóa, nhưng có thể giữ lại nếu có kế hoạch khác */
    .filter-card {
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }
    /* CSS cho .feature-icon đã được xóa vì section đó không còn */
    .loading-spinner-container {
      display: none;
      justify-content: center;
      align-items: center;
      padding: 40px 0;
    }
    .search-box {
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      padding: 25px;
      /* margin-top: -50px; /* Điều chỉnh lại margin-top nếu cần sau khi xóa hero-section */
      margin-top: 2rem; /* Hoặc một giá trị margin-top phù hợp khác */
      margin-bottom: 2rem; /* Thêm margin-bottom cho search-box */
      position: relative;
      z-index: 100;
    }
  </style>
</head>
<body>
<div id="header-placeholder"></div>

<section class="container search-box">
  <form id="searchForm" class="row g-3">
    <div class="col-md-9">
      <div class="input-group">
        <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
        <input
                type="text"
                class="form-control form-control-lg"
                name="keyword"
                id="keywordInput"
                placeholder="Tìm kiếm theo hãng, mẫu xe..."
                aria-label="Tìm kiếm xe"
        />
      </div>
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary btn-lg w-100" type="submit" id="searchButton">
        <i class="bi bi-search"></i> Tìm Xe
      </button>
    </div>
  </form>
</section>

<main class="container mb-5">
  <div id="globalMessages" class="mb-3"></div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Danh sách xe</h2>
    <div>
      <button class="btn btn-outline-secondary" type="button" id="showAllButton" title="Hiển thị tất cả">
        <i class="bi bi-list-ul"></i> Xem tất cả
      </button>
    </div>
  </div>

  <div id="loadingSpinner" class="loading-spinner-container">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Đang tải...</span>
    </div>
  </div>

  <div id="carListContainer" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4"></div>

  <div id="noCarsMessage" class="alert alert-warning mt-4 text-center" role="alert" style="display: none">
    <i class="bi bi-exclamation-triangle-fill me-2"></i> Không tìm thấy xe nào phù hợp với yêu cầu của bạn.
  </div>
</main>

<div id="footer-placeholder" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
  // Phần JavaScript giữ nguyên
  document.addEventListener("DOMContentLoaded", function () {
    const carListContainer = document.getElementById("carListContainer");
    const searchForm = document.getElementById("searchForm");
    const keywordInput = document.getElementById("keywordInput");
    const showAllButton = document.getElementById("showAllButton");
    const noCarsMessage = document.getElementById("noCarsMessage");

    function checkBookingSuccessMessage() {
      const successMessageJson = localStorage.getItem("bookingSuccessMessage");
      if (successMessageJson) {
        try {
          const successData = JSON.parse(successMessageJson);
          let detailedMessage = `${successData.message}`;
          if (successData.carInfo) {
            const { brand, model, startDate, endDate } = successData.carInfo;
            if (brand && model) {
              const formattedStartDate = formatDateForDisplay ? formatDateForDisplay(startDate) : startDate;
              const formattedEndDate = formatDateForDisplay ? formatDateForDisplay(endDate) : endDate;
              detailedMessage += `<br>Bạn đã đặt thành công xe <strong>${brand} ${model}</strong>`;
              if (startDate && endDate) {
                detailedMessage += ` từ ngày <strong>${formattedStartDate}</strong> đến <strong>${formattedEndDate}</strong>`;
              }
            }
          }
          displayGlobalMessage(detailedMessage, successData.type || "success");
          localStorage.removeItem("bookingSuccessMessage");
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (e) {
          console.error("Lỗi khi xử lý thông báo đặt xe thành công:", e);
          localStorage.removeItem("bookingSuccessMessage");
        }
      }
    }
    checkBookingSuccessMessage();

    function renderCar(car) {
      const carCard = document.createElement("div");
      carCard.className = "col";
      const transmissionDisplay = car.transmissionType || "";
      const fuelDisplay = car.fuelType || "";

      carCard.innerHTML = `
                <div class="card h-100 car-card shadow-sm">
                    <div class="position-relative">
                        <img src="${car.imageUrl || "/images/placeholder-car.png"}" class="card-img-top" alt="${
              car.brand || ""
      } ${car.model || ""}" onerror="this.onerror=null;this.src='/images/placeholder-car.png';">
                        ${
              car.available
                      ? ""
                      : '<span class="position-absolute top-0 end-0 bg-danger text-white py-1 px-2 m-2 rounded-pill">Hết xe</span>'
      }
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold">${car.brand || "N/A"} ${car.model || ""}</h5>
                        ${car.category ? `<h6 class="card-subtitle mb-2 text-muted">${car.category}</h6>` : ""}
                        <div class="car-specs text-muted mb-3">
                            ${
              car.numberOfSeats
                      ? `<span><i class="bi bi-people-fill"></i> ${car.numberOfSeats} chỗ</span>`
                      : ""
      }
                            ${
              transmissionDisplay
                      ? `<span><i class="bi bi-gear"></i> ${transmissionDisplay}</span>`
                      : ""
      }
                            ${fuelDisplay ? `<span><i class="bi bi-fuel-pump"></i> ${fuelDisplay}</span>` : ""}
                        </div>
                        <p class="card-text text-danger fw-bold fs-5 mb-3 price-tag">
                            <i class="bi bi-tags-fill"></i> ${formatCurrency(car.pricePerDay)}/ngày
                        </p>
                        <div class="mt-auto d-grid gap-2 d-sm-flex justify-content-sm-between">
                            <a href="/cars/details.html?id=${car.id}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i> Xem chi tiết
                            </a>
                            ${
              car.available
                      ? `<a href="/bookings/create.html?carId=${car.id}" class="btn btn-sm btn-primary">
                                <i class="bi bi-calendar-check"></i> Đặt ngay
                            </a>`
                      : `<span class="btn btn-sm btn-secondary disabled" aria-disabled="true">
                                <i class="bi bi-slash-circle"></i> Hết xe
                            </span>`
      }
                        </div>
                    </div>
                </div>
            `;
      return carCard;
    }

    async function fetchAndDisplayCars(url) {
      showLoading(true);
      carListContainer.innerHTML = "";
      carListContainer.style.display = "none";
      noCarsMessage.style.display = "none";

      try {
        const response = await fetch(url);
        if (!response.ok) {
          if (response.status === 204) {
            noCarsMessage.style.display = "block";
            return;
          }
          let errorMsg = `Lỗi HTTP: ${response.status} ${response.statusText}`;
          try {
            const errorData = await response.json();
            errorMsg = errorData?.message || errorMsg;
          } catch (e) {
            /* Bỏ qua lỗi parse JSON */
          }
          throw new Error(errorMsg);
        }
        const cars = await response.json();
        if (cars && Array.isArray(cars) && cars.length > 0) {
          cars.forEach((car) => {
            if (car && car.id) {
              carListContainer.appendChild(renderCar(car));
            } else {
              console.warn("Received invalid car object:", car);
            }
          });
        } else {
          noCarsMessage.style.display = "block";
        }
      } catch (error) {
        console.error("Lỗi khi tải danh sách xe:", error);
        displayGlobalMessage("Không thể tải danh sách xe. Vui lòng thử lại. (" + error.message + ")");
        noCarsMessage.style.display = "block";
      } finally {
        showLoading(false);
        carListContainer.style.display = "flex";
      }
    }
    const initialFetchUrl = "/api/cars/available";
    fetchAndDisplayCars(initialFetchUrl);
    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const keyword = keywordInput.value.trim();
      let searchUrl = "/api/cars/search";
      if (keyword) {
        searchUrl += `?keyword=${encodeURIComponent(keyword)}`;
        fetchAndDisplayCars(searchUrl);
      } else {
        fetchAndDisplayCars(initialFetchUrl);
      }
    });
    showAllButton.addEventListener("click", function () {
      keywordInput.value = "";
      fetchAndDisplayCars(initialFetchUrl);
    });
  });
</script>
</body>
</html>
