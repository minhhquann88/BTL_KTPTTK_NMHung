<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thuê xe Online - MQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background-color: #f8f9fa; }
    .car-card { margin-bottom: 1.5rem; transition: transform 0.3s ease, box-shadow 0.3s ease; border-radius: 12px; overflow: hidden; }
    .car-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); }
    .car-card .card-img-top { object-fit: cover; height: 200px; width: 100%; border-bottom: 1px solid #dee2e6; }
    .price-tag { background-color: rgba(220, 53, 69, 0.1); padding: 8px 12px; border-radius: 6px; display: inline-block; }
    .loading-spinner-container { display: none; justify-content: center; align-items: center; padding: 40px 0; }
    .search-box { background-color: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); padding: 25px; margin-top: 2rem; margin-bottom: 2rem; position: relative; z-index: 100; }
    .select-car-checkbox { position: absolute; top: 10px; left: 10px; z-index: 10; transform: scale(1.5); } /* NEW STYLE */
  </style>
</head>
<body>
<div id="header-placeholder"></div>

<section class="container search-box">
  <h4 class="mb-3 text-center">Tìm xe theo ngày bạn muốn</h4>
  <form id="findCarsByDateForm" class="row g-3 align-items-end">
    <div class="col-md-5">
      <label for="startDate" class="form-label">Ngày nhận xe</label>
      <input type="date" class="form-control form-control-lg" id="startDate" />
      <div class="invalid-feedback">Vui lòng chọn ngày nhận.</div>
    </div>
    <div class="col-md-5">
      <label for="endDate" class="form-label">Ngày trả xe</label>
      <input type="date" class="form-control form-control-lg" id="endDate" />
      <div class="invalid-feedback">Vui lòng chọn ngày trả.</div>
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary btn-lg w-100" type="submit" id="findAvailableCarsByDateButton">
        <i class="bi bi-calendar-check-fill"></i> Lọc
      </button>
    </div>
  </form>
</section>

<main class="container mb-5">
  <div id="globalMessages" class="mb-3"></div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 id="carListTitle" class="mb-0">Tất cả xe hiện có</h2>
    <div>
      <button class="btn btn-success btn-sm me-2" type="button" id="bookSelectedCarsButton">
        <i class="bi bi-check2-square"></i> Đặt các xe đã chọn
      </button>
      <button class="btn btn-outline-secondary btn-sm" type="button" id="showAllCarsButton" title="Hiển thị tất cả xe và xóa bộ lọc ngày">
        <i class="bi bi-list-ul"></i> Hiện tất cả / Xóa lọc
      </button>
    </div>
  </div>

  <div id="loadingSpinner" class="loading-spinner-container">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Đang tải...</span></div>
  </div>

  <div id="carListContainer" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4"></div>
  <div id="noCarsMessage" class="alert alert-warning mt-4 text-center" role="alert" style="display: none">
    <i class="bi bi-exclamation-triangle-fill me-2"></i> Không tìm thấy xe nào phù hợp với yêu cầu của bạn.
  </div>
</main>

<div id="footer-placeholder" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const carListContainer = document.getElementById("carListContainer");
    const findCarsByDateForm = document.getElementById("findCarsByDateForm");
    const startDateInput = document.getElementById("startDate");
    const endDateInput = document.getElementById("endDate");
    const noCarsMessage = document.getElementById("noCarsMessage");
    const carListTitle = document.getElementById("carListTitle");
    const showAllCarsButton = document.getElementById("showAllCarsButton");
    const bookSelectedCarsButton = document.getElementById("bookSelectedCarsButton"); // NEW

    const today = new Date().toISOString().split("T")[0];
    startDateInput.min = today;
    endDateInput.min = today;

    let currentSearchModeIsByDate = false;

    startDateInput.addEventListener('change', () => {
      if (endDateInput.value && endDateInput.value < startDateInput.value) {
        endDateInput.value = startDateInput.value;
      }
      endDateInput.min = startDateInput.value || today;
    });

    function checkBookingSuccessMessage() { // This function might need adjustment for multi-booking confirmation messages
      const successMessageJson = localStorage.getItem("bookingSuccessMessage");
      if (successMessageJson) {
        try {
          const successData = JSON.parse(successMessageJson);
          let detailedMessage = `${successData.message}`;
          if (successData.isMultiBooking) { // Check if it's a multi-booking confirmation
            if (successData.successfulBookings && successData.successfulBookings.length > 0) {
              detailedMessage += `<br><strong>Đặt thành công ${successData.successfulBookings.length} xe.</strong>`;
              // Optionally list car brands/models if available in successData
            }
            if (successData.failedBookings && successData.failedBookings.length > 0) {
              detailedMessage += `<br><strong>Có ${successData.failedBookings.length} xe không đặt được.</strong> Vui lòng kiểm tra trang xác nhận để biết chi tiết.`;
            }
          } else if (successData.carInfo) { // Existing single booking message
            const { brand, model, startDate, endDate } = successData.carInfo;
            if (brand && model) {
              const formattedStartDate = formatDateForDisplay ? formatDateForDisplay(startDate) : startDate;
              const formattedEndDate = formatDateForDisplay ? formatDateForDisplay(endDate) : endDate;
              detailedMessage += `<br>Bạn đã đặt thành công xe <strong>${brand} ${model}</strong>`;
              if (startDate && endDate) {
                detailedMessage += ` từ ngày <strong>${formattedStartDate}</strong> đến <strong>${formattedEndDate}</strong>`;
              }
            }
          }
          displayGlobalMessage(detailedMessage, successData.type || "success", "globalMessages", true);
          localStorage.removeItem("bookingSuccessMessage");
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (e) {
          console.error("Lỗi khi xử lý thông báo đặt xe thành công:", e);
          localStorage.removeItem("bookingSuccessMessage");
        }
      }
    }
    checkBookingSuccessMessage();

    function renderCar(car) {
      const carCard = document.createElement("div");
      carCard.className = "col position-relative"; // Added position-relative for checkbox
      const transmissionDisplay = car.transmissionType || "";
      const fuelDisplay = car.fuelType || "";

      // ADD CHECKBOX
      const checkboxHtml = `
        <input class="form-check-input select-car-checkbox" type="checkbox" value="${car.id}" id="selectCar-${car.id}" title="Chọn xe này">
      `;

      let bookingButtonHtml = '';
      if (car.available) {
        bookingButtonHtml = `<a href="#" class="btn btn-sm btn-primary book-now-btn" data-car-id="${car.id}">
                                <i class="bi bi-calendar-check"></i> Đặt ngay
                            </a>`;
      } else {
        bookingButtonHtml = `<span class="btn btn-sm btn-secondary disabled" aria-disabled="true">
                                <i class="bi bi-slash-circle"></i> ${currentSearchModeIsByDate ? 'Không trống lịch' : 'Hết xe'}
                            </span>`;
      }

      carCard.innerHTML = `
        ${checkboxHtml} <div class="card h-100 car-card shadow-sm">
            <div class="position-relative">
                <img src="${car.imageUrl || "/images/placeholder-car.png"}" class="card-img-top" alt="${car.brand || ""} ${car.model || ""}" onerror="this.onerror=null;this.src='/images/placeholder-car.png';">
                ${!car.available && !currentSearchModeIsByDate ? '<span class="position-absolute top-0 end-0 bg-danger text-white py-1 px-2 m-2 rounded-pill">Hết xe (chung)</span>' : ''}
            </div>
            <div class="card-body d-flex flex-column">
                <h5 class="card-title fw-bold">${car.brand || "N/A"} ${car.model || ""}</h5>
                ${car.category ? `<h6 class="card-subtitle mb-2 text-muted">${car.category}</h6>` : ""}
                <div class="car-specs text-muted mb-3">
                    ${car.numberOfSeats ? `<span><i class="bi bi-people-fill"></i> ${car.numberOfSeats} chỗ</span>` : ""}
                    ${transmissionDisplay ? `<span><i class="bi bi-gear"></i> ${transmissionDisplay}</span>` : ""}
                    ${fuelDisplay ? `<span><i class="bi bi-fuel-pump"></i> ${fuelDisplay}</span>` : ""}
                </div>
                <p class="card-text text-danger fw-bold fs-5 mb-3 price-tag">
                    <i class="bi bi-tags-fill"></i> ${formatCurrency(car.pricePerDay)}/ngày
                </p>
                <div class="mt-auto d-grid gap-2 d-sm-flex justify-content-sm-between">
                    <a href="/cars/details.html?id=${car.id}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-eye"></i> Xem chi tiết
                    </a>
                    ${bookingButtonHtml}
                </div>
            </div>
        </div>`;

      if (car.available) {
        const bookNowBtn = carCard.querySelector('.book-now-btn');
        if (bookNowBtn) {
          bookNowBtn.addEventListener('click', function(event) {
            event.preventDefault();
            const carId = this.dataset.carId;
            const startDateValue = startDateInput.value;
            const endDateValue = endDateInput.value;

            // For single booking, require date selection if search by date was active
            // or allow proceeding to create.html to select dates if not filtered by date.
            if (currentSearchModeIsByDate) {
              if (!startDateValue || !endDateValue) {
                displayGlobalMessage("Vui lòng chọn ngày nhận và trả xe trong bộ lọc trước khi đặt xe này.", "warning");
                findCarsByDateForm.scrollIntoView({ behavior: 'smooth' });
                return;
              }
              localStorage.setItem('selectedStartDate', startDateValue);
              localStorage.setItem('selectedEndDate', endDateValue);
            } else {
              // If not searching by date, clear any previously stored dates
              // to ensure create.html requires new date selection.
              // However, create.html needs dates. So for single booking from "all cars"
              // maybe we should also prompt for dates or redirect to a version of create.html
              // that allows date picking. For now, let's assume if not currentSearchModeIsByDate,
              // dates are not strictly required by this button but will be by create.html.
              // To make create.html work, we *must* have dates.
              // So, single "Đặt ngay" will always require dates if coming from a filtered list.
              // If from "all cars", it should prompt for dates or ensure create.html allows picking them.
              // The current create.html *requires* dates in localStorage or it fails.
              // So, if not in date search mode, we must prompt/get dates before going to create.html
              if (!startDateValue || !endDateValue) {
                displayGlobalMessage("Vui lòng chọn ngày nhận và trả xe ở bộ lọc phía trên.", "warning");
                findCarsByDateForm.scrollIntoView({ behavior: 'smooth' });
                return;
              }
              localStorage.setItem('selectedStartDate', startDateValue);
              localStorage.setItem('selectedEndDate', endDateValue);
            }
            window.location.href = `/bookings/create.html?carId=${carId}`;
          });
        }
      }
      return carCard;
    }

    async function fetchAndDisplayCars(url, isDateSearch = false) {
      showLoading(true);
      carListContainer.innerHTML = "";
      carListContainer.style.display = "none";
      noCarsMessage.style.display = "none";
      currentSearchModeIsByDate = isDateSearch; // Update search mode

      try {
        const response = await fetch(url);
        if (!response.ok) {
          if (response.status === 204 || response.status === 404) { // Handle 204 No Content and 404
            noCarsMessage.style.display = "block";
            carListTitle.textContent = isDateSearch ? "Không có xe nào trống trong khoảng ngày đã chọn" : "Không tìm thấy xe";
            return;
          }
          let errorMsg = `Lỗi HTTP: ${response.status} ${response.statusText}`;
          try { const errorData = await response.json(); errorMsg = errorData?.message || errorMsg; } catch (e) { /* Ignore */ }
          throw new Error(errorMsg);
        }
        const cars = await response.json();
        if (cars && Array.isArray(cars) && cars.length > 0) {
          cars.forEach((car) => {
            if (car && car.id) {
              carListContainer.appendChild(renderCar(car));
            } else {
              console.warn("Received invalid car object:", car);
            }
          });
          if (isDateSearch) {
            const SDate = localStorage.getItem('selectedStartDate'); // Use stored dates for title
            const EDate = localStorage.getItem('selectedEndDate');
            if(SDate && EDate){
              carListTitle.textContent = `Các xe trống từ ${formatDateForDisplay(SDate)} đến ${formatDateForDisplay(EDate)}`;
            } else {
              carListTitle.textContent = "Kết quả lọc theo ngày";
            }
          } else {
            carListTitle.textContent = "Tất cả xe hiện có";
          }
        } else {
          noCarsMessage.style.display = "block";
          carListTitle.textContent = isDateSearch ? "Không có xe nào trống trong khoảng ngày đã chọn" : "Hiện không có xe nào";
        }
      } catch (error) {
        console.error("Lỗi khi tải danh sách xe:", error);
        displayGlobalMessage("Không thể tải danh sách xe. (" + error.message + ")", "danger");
        noCarsMessage.style.display = "block";
        carListTitle.textContent = "Lỗi khi tải xe";
      } finally {
        showLoading(false);
        carListContainer.style.display = "flex"; // or "block" depending on layout
      }
    }

    findCarsByDateForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const startDate = startDateInput.value;
      const endDate = endDateInput.value;

      startDateInput.classList.remove('is-invalid');
      endDateInput.classList.remove('is-invalid');
      let valid = true;
      if (!startDate) {
        startDateInput.classList.add('is-invalid');
        valid = false;
      }
      if (!endDate) {
        endDateInput.classList.add('is-invalid');
        valid = false;
      }
      if (startDate && endDate && startDate > endDate) {
        endDateInput.classList.add('is-invalid');
        displayGlobalMessage("Ngày trả phải sau hoặc bằng ngày nhận.", "warning");
        valid = false;
      }
      if (!valid) {
        if(!startDate && !endDate) displayGlobalMessage("Vui lòng chọn ngày nhận và ngày trả.", "warning");
        else if (!startDate) displayGlobalMessage("Vui lòng chọn ngày nhận.", "warning");
        else if (!endDate) displayGlobalMessage("Vui lòng chọn ngày trả.", "warning");
        return;
      }

      // Store selected dates for use by booking process
      localStorage.setItem('selectedStartDate', startDate);
      localStorage.setItem('selectedEndDate', endDate);
      const searchUrl = `/api/cars/available-by-date?startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}`;
      fetchAndDisplayCars(searchUrl, true);
    });

    showAllCarsButton.addEventListener("click", function() {
      startDateInput.value = "";
      endDateInput.value = "";
      localStorage.removeItem('selectedStartDate');
      localStorage.removeItem('selectedEndDate');
      // Uncheck all car checkboxes
      document.querySelectorAll('.select-car-checkbox:checked').forEach(cb => cb.checked = false);
      carListTitle.textContent = "Tất cả xe hiện có";
      fetchAndDisplayCars("/api/cars/available", false);
    });

    // NEW: Event listener for "Đặt các xe đã chọn"
    bookSelectedCarsButton.addEventListener("click", function() {
      const selectedCarCheckboxes = document.querySelectorAll('.select-car-checkbox:checked');
      const selectedCarIds = Array.from(selectedCarCheckboxes).map(cb => cb.value);

      const startDate = startDateInput.value;
      const endDate = endDateInput.value;

      if (selectedCarIds.length === 0) {
        displayGlobalMessage("Vui lòng chọn ít nhất một xe để đặt.", "warning");
        return;
      }
      if (!startDate || !endDate) {
        displayGlobalMessage("Vui lòng chọn ngày nhận và ngày trả xe trong bộ lọc.", "warning");
        findCarsByDateForm.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      if (startDate > endDate) {
        displayGlobalMessage("Ngày trả phải sau hoặc bằng ngày nhận.", "warning");
        endDateInput.classList.add('is-invalid');
        return;
      }

      localStorage.setItem('selectedStartDate', startDate);
      localStorage.setItem('selectedEndDate', endDate);

      const carIdParams = selectedCarIds.map(id => `carId=${encodeURIComponent(id)}`).join('&');
      window.location.href = `/bookings/create.html?${carIdParams}`;
    });

    fetchAndDisplayCars("/api/cars/available", false); // Initial load
  });
</script>
</body>
</html>
