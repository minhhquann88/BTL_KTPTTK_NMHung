<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác nhận Đặt Xe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .confirmation-card { background-color: white; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
    .loading-spinner-container { display: none; justify-content: center; align-items: center; padding: 40px 0; }
    .detail-label { font-weight: 500; color: #555; }
    .detail-value { font-weight: bold; }
    .print-button { margin-right: 10px; }
    .main-confirmation-header { margin-bottom: 2rem; }
  </style>
</head>
<body>
<div id="header-placeholder"></div>

<main class="container mt-4 mb-5">
  <div id="loadingSpinner" class="loading-spinner-container">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Đang tải...</span></div>
  </div>
  <div id="globalMessages" class="mb-3"></div>

  <div id="confirmationPageContainer">
    <div class="text-center main-confirmation-header">
      <h2 id="mainConfirmationTitle" class="mb-0"><i class="bi bi-check-circle-fill text-success"></i> Đặt Xe Thành Công!</h2>
      <p id="mainConfirmationLead" class="lead mt-2">Cảm ơn bạn đã đặt xe tại MQ. Dưới đây là thông tin chi tiết đơn đặt của bạn:</p>
    </div>

    <div id="allBookingsContainer">
    </div>

    <div id="bookingNotFoundMessage" class="alert alert-danger mt-4" role="alert" style="display: none;">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> Không tìm thấy thông tin đơn đặt xe.
      <p><a href="/index.html" class="alert-link">Quay lại trang chủ</a></p>
    </div>

    <div class="text-center mt-4" id="actionButtons" style="display: none;">
      <button class="btn btn-outline-secondary print-button" onclick="window.print();">
        <i class="bi bi-printer"></i> In xác nhận
      </button>
      <a href="/index.html" class="btn btn-primary">
        <i class="bi bi-house-door"></i> Về trang chủ
      </a>
    </div>
  </div>
</main>

<div id="footer-placeholder" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const allBookingsContainer = document.getElementById('allBookingsContainer');
    const bookingNotFoundMessage = document.getElementById('bookingNotFoundMessage');
    const mainConfirmationTitle = document.getElementById('mainConfirmationTitle');
    const mainConfirmationLead = document.getElementById('mainConfirmationLead');
    const actionButtons = document.getElementById('actionButtons');


    async function fetchAndDisplayBookingDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const bookingIds = urlParams.getAll('bookingId'); // Get all bookingId parameters

      if (!bookingIds || bookingIds.length === 0) {
        displayGlobalMessage('Không tìm thấy mã đặt xe trong URL.', 'danger');
        bookingNotFoundMessage.textContent = 'Không tìm thấy mã đặt xe trong URL. Không thể hiển thị xác nhận.';
        bookingNotFoundMessage.style.display = 'block';
        mainConfirmationTitle.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i> Lỗi hiển thị xác nhận';
        mainConfirmationLead.textContent = 'Đã có lỗi xảy ra hoặc không tìm thấy thông tin đặt xe.';
        return;
      }

      showLoading(true);
      allBookingsContainer.innerHTML = ''; // Clear previous content
      bookingNotFoundMessage.style.display = 'none';
      let successfulFetches = 0;

      for (const bookingId of bookingIds) {
        try {
          const response = await fetch(`/api/bookings/details/${bookingId}`);
          if (!response.ok) {
            let errorMsg = `Lỗi HTTP ${response.status} khi tải đơn #${bookingId}`;
            try { const errorData = await response.json(); errorMsg = errorData?.message ? `Đơn #${bookingId}: ${errorData.message}` : errorMsg; } catch (e) {}
            throw new Error(errorMsg);
          }
          const booking = await response.json();

          if (booking && booking.id) {
            renderSingleBookingConfirmation(booking, bookingIds.length > 1);
            successfulFetches++;
          } else {
            throw new Error(`Dữ liệu không hợp lệ cho đơn đặt xe #${bookingId}.`);
          }
        } catch (error) {
          console.error('Lỗi khi tải chi tiết đặt xe:', error);
          displayGlobalMessage('Không thể tải thông tin cho đơn đặt xe #' + bookingId + ': ' + error.message, 'warning', 'globalMessages', false); // Append warning
        }
      }
      showLoading(false);

      if (successfulFetches > 0) {
        document.title = successfulFetches > 1 ? `Xác nhận ${successfulFetches} đơn hàng - Thuê Xe MQ` : `Xác nhận đơn hàng #${bookingIds[0]} - Thuê Xe MQ`;
        if (successfulFetches === 1 && bookingIds.length ===1){
          mainConfirmationTitle.innerHTML = `<i class="bi bi-check-circle-fill text-success"></i> Đặt Xe Thành Công!`;
          mainConfirmationLead.textContent = `Cảm ơn bạn đã đặt xe tại MQ. Dưới đây là thông tin chi tiết đơn đặt của bạn:`;
        } else if (successfulFetches > 0) {
          mainConfirmationTitle.innerHTML = `<i class="bi bi-check-circle-fill text-success"></i> Yêu Cầu Đặt Xe Hoàn Tất!`;
          mainConfirmationLead.textContent = `Đã xử lý ${bookingIds.length} yêu cầu đặt xe. Chi tiết các đơn thành công như sau:`;
        }
        actionButtons.style.display = 'block';
      } else {
        bookingNotFoundMessage.textContent = 'Không thể tải thông tin cho bất kỳ đơn đặt xe nào được yêu cầu.';
        bookingNotFoundMessage.style.display = 'block';
        mainConfirmationTitle.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i> Không có đơn nào được xác nhận';
        mainConfirmationLead.textContent = 'Vui lòng thử lại hoặc liên hệ hỗ trợ.';
        actionButtons.style.display = 'none';
      }
    }

    function renderSingleBookingConfirmation(booking, isMultipleContext) {
      const cardDiv = document.createElement('div');
      cardDiv.className = 'card confirmation-card';

      // If it's a single booking overall, we don't need a per-card header, the main page header is enough.
      // If multiple, each card gets its own success header.
      const cardHeaderHtml = isMultipleContext ? `
        <div class="card-header bg-success text-white text-center py-3">
          <h4 class="mb-0"><i class="bi bi-check-circle-fill"></i> Đặt Xe Thành Công (Đơn #${booking.id})</h4>
        </div>` : '';


      cardDiv.innerHTML = `
        ${cardHeaderHtml}
        <div class="card-body p-4 p-md-5">
            ${!isMultipleContext ? '' : `<h5 class="mb-3 text-center">Chi tiết đơn đặt xe #${booking.id}</h5>`}
            <div class="row g-3">
                <div class="col-md-6">
                    <p><span class="detail-label">Khách hàng:</span> <span class="detail-value">${booking.customerFullName || 'N/A'}</span></p>
                    <p><span class="detail-label">Email:</span> <span class="detail-value">${booking.customerEmail || 'N/A'}</span></p>
                    <p><span class="detail-label">Điện thoại:</span> <span class="detail-value">${booking.customerPhoneNumber || 'N/A'}</span></p>
                </div>
                <div class="col-md-6">
                    <p><span class="detail-label">Xe:</span> <span class="detail-value">${booking.carBrand || ''} ${booking.carModel || ''}</span></p>
                    <p><span class="detail-label">Biển số:</span> <span class="detail-value">${booking.carLicensePlate || 'N/A'}</span></p>
                    <p><span class="detail-label">Trạng thái:</span> <span class="badge bg-warning text-dark">${booking.status || 'N/A'}</span></p>
                </div>
                <div class="col-12"><hr class="my-2"></div>
                <div class="col-md-6">
                    <p><span class="detail-label">Ngày nhận:</span> <span class="detail-value">${formatDateForDisplay(booking.startDate) || 'N/A'}</span></p>
                </div>
                <div class="col-md-6">
                    <p><span class="detail-label">Ngày trả:</span> <span class="detail-value">${formatDateForDisplay(booking.endDate) || 'N/A'}</span></p>
                </div>
                <div class="col-12">
                    <p><span class="detail-label">Ghi chú:</span> <span class="detail-value fst-italic">${booking.notes || '(Không có)'}</span></p>
                </div>
                <div class="col-12 text-end mt-3">
                    <h5><span class="detail-label">Tổng cộng cho xe này:</span> <span class="detail-value text-danger">${formatCurrency(booking.totalPrice)}</span></h5>
                </div>
            </div>
        </div>
        <div class="card-footer text-center text-muted small py-3">
            Mã đơn hàng: <strong id="footerBookingId-${booking.id}">#${booking.id}</strong> - Ngày đặt: <strong id="footerBookingDate-${booking.id}">${formatLocalDateTime(booking.bookingDate) || 'N/A'}</strong>
        </div>
      `;
      allBookingsContainer.appendChild(cardDiv);
    }

    // Clear any multi-booking success message from index.html that might have been set
    localStorage.removeItem("bookingSuccessMessage");
    fetchAndDisplayBookingDetails();
  });
</script>
</body>
</html>
