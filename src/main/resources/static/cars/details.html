<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết xe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .car-detail-img { max-width: 100%; height: auto; border-radius: 0.5rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,.15); }
        .car-spec-icon { width: 1.5em; display: inline-block; text-align: center; color: #6c757d; }
        .loading-spinner-container { display: none; justify-content: center; align-items: center; padding: 40px 0; }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<main class="container mt-4">
    <div id="loadingSpinner" class="loading-spinner-container">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Đang tải...</span></div>
    </div>

    <div id="globalMessages" class="mb-3"></div>

    <nav aria-label="breadcrumb" id="breadcrumbNav" style="display: none;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/index.html">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page" id="breadcrumbCarName">Chi tiết xe</li>
        </ol>
    </nav>

    <div id="carDetailContainer" style="display: none;">
    </div>

    <div id="carNotFoundMessage" class="alert alert-warning mt-4" role="alert" style="display: none;">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> Không tìm thấy thông tin chi tiết cho xe này.
        <p><a href="/index.html" class="alert-link">Quay lại trang chủ</a></p>
    </div>
</main>

<div id="footer-placeholder" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const carDetailContainer = document.getElementById('carDetailContainer');
        const carNotFoundMessage = document.getElementById('carNotFoundMessage');
        const breadcrumbNav = document.getElementById('breadcrumbNav');
        const breadcrumbCarName = document.getElementById('breadcrumbCarName');

        function renderCarDetails(car) {
            const carFullName = `${car.brand || 'N/A'} ${car.model || ''}`;
            document.title = `Chi tiết xe - ${carFullName}`;
            breadcrumbCarName.textContent = carFullName;
            breadcrumbNav.style.display = 'block';

            const transmissionDisplay = car.transmissionType || '';
            const fuelDisplay = car.fuelType || '';

            carDetailContainer.innerHTML = `
                <div class="row g-4">
                    <div class="col-lg-6">
                        <img src="${car.imageUrl || '/images/placeholder-car.png'}" class="car-detail-img" alt="Ảnh chi tiết xe ${carFullName}" onerror="this.onerror=null;this.src='/images/placeholder-car.png';">
                    </div>
                    <div class="col-lg-6">
                        <h1>${carFullName}</h1>
                        ${car.category ? `<p class="lead text-muted">Loại xe: ${car.category}</p>` : ''}
                        <hr>
                        <h5>Thông số kỹ thuật</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <p class="mb-2"><i class="bi bi-card-list car-spec-icon"></i> Biển số: <strong>${car.licensePlate || 'N/A'}</strong></p>
                                <p class="mb-2"><i class="bi bi-calendar-event car-spec-icon"></i> Năm SX: <strong>${car.productionYear || 'N/A'}</strong></p>
                                ${car.numberOfSeats ? `<p class="mb-2"><i class="bi bi-people-fill car-spec-icon"></i> Số chỗ: <strong>${car.numberOfSeats} chỗ</strong></p>` : ''}
                            </div>
                            <div class="col-md-6">
                                ${fuelDisplay ? `<p class="mb-2"><i class="bi bi-fuel-pump car-spec-icon"></i> Nhiên liệu: <strong>${fuelDisplay}</strong></p>` : ''}
                                ${transmissionDisplay ? `<p class="mb-2"><i class="bi bi-gear car-spec-icon"></i> Hộp số: <strong>${transmissionDisplay}</strong></p>` : ''}
                                <p class="mb-2"><i class="bi bi-info-circle car-spec-icon"></i> Trạng thái:
                                    ${car.available ? '<span class="badge bg-success">Còn xe</span>' : '<span class="badge bg-danger">Hết xe</span>'}
                                </p>
                            </div>
                        </div>
                        <p class="fs-4 text-danger fw-bold mb-3">
                            <i class="bi bi-tags-fill"></i> Giá thuê: <span>${formatCurrency(car.pricePerDay)}/ngày</span>
                        </p>
                        <div class="mt-3">
                            <h4>Mô tả chi tiết</h4>
                            <p style="white-space: pre-wrap;">${car.description || 'Không có mô tả chi tiết cho xe này.'}</p>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            ${car.available
                ? `<a href="/bookings/create.html?carId=${car.id}" class="btn btn-primary btn-lg"><i class="bi bi-calendar-check"></i> Đặt ngay xe này</a>`
                : `<button class="btn btn-secondary btn-lg" disabled><i class="bi bi-slash-circle"></i> Tạm hết xe</button>`
            }
                            <a href="/index.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
                        </div>
                    </div>
                </div>
            `;
            carDetailContainer.style.display = 'block';
            carNotFoundMessage.style.display = 'none';
        }

        async function fetchCarDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const carId = urlParams.get('id');

            if (!carId || isNaN(parseInt(carId))) {
                carNotFoundMessage.textContent = 'ID xe không hợp lệ.';
                carNotFoundMessage.style.display = 'block';
                breadcrumbNav.style.display = 'none';
                return;
            }

            showLoading(true);
            carDetailContainer.style.display = 'none';
            carNotFoundMessage.style.display = 'none';

            // API để lấy chi tiết xe
            const apiUrl = `/cars/${carId}`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    if (response.status === 404) {
                        carNotFoundMessage.style.display = 'block';
                    } else {
                        let errorMsg = `Lỗi HTTP: ${response.status} ${response.statusText}`;
                        try {
                            const errorData = await response.json();
                            errorMsg = errorData?.message || errorMsg;
                        } catch (e) { }
                        throw new Error(errorMsg);
                    }
                    return;
                }

                const car = await response.json();
                if (car && car.id) {
                    renderCarDetails(car);
                } else {
                    carNotFoundMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Lỗi khi tải chi tiết xe:', error);
                displayGlobalMessage('Không thể tải chi tiết xe: ' + error.message);
                carNotFoundMessage.style.display = 'block';
            } finally {
                showLoading(false);
            }
        }

        // Gọi hàm để tải chi tiết xe
        fetchCarDetails();
    });
</script>
</body>
</html>
