<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle ?: 'Chi tiết xe'}">Chi tiết xe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .car-detail-img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,.15);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${car?.brand + ' ' + car?.model}">Chi tiết xe</li>
        </ol>
    </nav>

    <div th:if="${car}">
        <div class="row g-4">
            <div class="col-lg-6">
                <img th:src="${car.imageUrl != null ? car.imageUrl : '/images/default-car.png'}" class="car-detail-img" alt="Ảnh chi tiết xe">

            </div>
            <div class="col-lg-6">
                <h1 th:text="${car.brand + ' ' + car.model}">Tên Xe</h1>
                <hr>
                <p class="fs-5">
                    <i class="bi bi-card-list text-secondary"></i> Biển số: <strong th:text="${car.licensePlate}">XXX-XX</strong>
                </p>
                <p class="fs-5">
                    <i class="bi bi-calendar-event text-secondary"></i> Năm sản xuất: <strong th:text="${car.productionYear}">20XX</strong>
                </p>
                <p class="fs-5 text-danger fw-bold">
                    <i class="bi bi-tags-fill"></i> Giá thuê: <span th:text="${#numbers.formatDecimal(car.pricePerDay, 0, 'COMMA', 0, 'POINT')} + ' VNĐ/ngày'"></span>
                </p>
                <p class="fs-5">
                    <i class="bi bi-info-circle text-secondary"></i> Trạng thái:
                    <span th:if="${car.available}" class="badge bg-success">Còn xe</span>
                    <span th:unless="${car.available}" class="badge bg-danger">Tạm hết xe</span>
                </p>

                <div class="mt-3">
                    <h4>Mô tả chi tiết</h4>
                    <p th:text="${car.description ?: 'Không có mô tả chi tiết cho xe này.'}">Mô tả xe...</p>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <a th:if="${car.available}" th:href="@{/bookings/create/{carId}(carId=${car.id})}" class="btn btn-primary btn-lg">
                        <i class="bi bi-calendar-check"></i> Đặt ngay xe này
                    </a>
                    <button th:unless="${car.available}" class="btn btn-secondary btn-lg" disabled>
                        <i class="bi bi-slash-circle"></i> Tạm hết xe
                    </button>
                    <a th:href="@{/}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Quay lại danh sách
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:unless="${car}" class="alert alert-warning" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> Không tìm thấy thông tin chi tiết cho xe này.
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
