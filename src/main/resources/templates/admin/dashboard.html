<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle ?: 'Trang Quản Trị'}">Trang Quản Trị</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}"/> <style>
  .dashboard-card {
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
  }
  .dashboard-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    color: inherit; /* Giữ màu chữ khi hover */
  }
  .dashboard-card .card-body {
    min-height: 150px; /* Đảm bảo chiều cao tối thiểu */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .dashboard-card .card-title i {
    font-size: 2rem; /* Kích thước icon lớn hơn */
    margin-bottom: 0.5rem;
  }
</style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4">
  <h1 class="mb-4" th:text="${pageTitle}">Trang Quản Trị</h1>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

    <div class="col">
      <a th:href="@{/admin/customers}" class="card h-100 shadow-sm dashboard-card">
        <div class="card-body text-center">
          <h5 class="card-title">
            <i class="bi bi-people-fill text-primary"></i><br>
            Quản lý Khách hàng
          </h5>
          <p class="card-text small">Xem, thêm, sửa, xóa thông tin khách hàng.</p>
        </div>
      </a>
    </div>

    <div class="col">
      <a href="#" class="card h-100 shadow-sm dashboard-card text-muted" aria-disabled="true" style="cursor: not-allowed;"> <div class="card-body text-center">
        <h5 class="card-title">
          <i class="bi bi-bar-chart-line-fill text-secondary"></i><br>
          Thống kê Khách hàng
        </h5>
        <p class="card-text small">Xem thống kê doanh thu theo khách hàng (Sắp có).</p>
      </div>
      </a>
    </div>

    <div class="col">
      <a href="#" class="card h-100 shadow-sm dashboard-card text-muted" aria-disabled="true" style="cursor: not-allowed;"> <div class="card-body text-center">
        <h5 class="card-title">
          <i class="bi bi-car-front-fill text-success"></i><br>
          Quản lý Xe
        </h5>
        <p class="card-text small">Quản lý danh sách xe cho thuê.</p>
      </div>
      </a>
    </div>

    <div class="col">
      <a href="#" class="card h-100 shadow-sm dashboard-card text-muted" aria-disabled="true" style="cursor: not-allowed;"> <div class="card-body text-center">
        <h5 class="card-title">
          <i class="bi bi-calendar-check-fill text-warning"></i><br>
          Quản lý Đặt xe
        </h5>
        <p class="card-text small">Xem và quản lý các đơn đặt xe.</p>
      </div>
      </a>
    </div>


  </div>

</main>

<div th:replace="~{fragments/footer :: footer}" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
