<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <title th:text="${pageTitle ?: 'Thuê xe Online'}">Trang chủ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/style.css}"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* Thêm một chút khoảng cách dưới cho các card */
        .car-card {
            margin-bottom: 1.5rem;
        }
        /* Căn giữa ảnh trong card */
        .car-card .card-img-top {
            object-fit: cover; /* Giữ tỉ lệ ảnh, cắt nếu cần */
            height: 200px; /* Chiều cao cố định cho ảnh */
            width: 100%;
        }
    </style>

</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4"> <h1 class="mb-4" th:text="${pageTitle ?: 'Danh sách xe'}">Danh sách xe</h1>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="@{/search}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" class="form-control" name="keyword" placeholder="Tìm kiếm theo hãng, mẫu xe..." th:value="${keyword}" aria-label="Tìm kiếm xe">
            <button class="btn btn-outline-primary" type="submit">
                <i class="bi bi-search"></i> Tìm kiếm
            </button>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${not #lists.isEmpty(cars)}">
        <div class="col" th:each="car : ${cars}">
            <div class="card h-100 car-card shadow-sm"> <img th:src="${car.imageUrl != null ? car.imageUrl : '/images/default-car.png'}" class="card-img-top" alt="Ảnh xe">
                <div class="card-body d-flex flex-column"> <h5 class="card-title" th:text="${car.brand + ' ' + car.model}">Tên xe</h5>
                    <p class="card-text mb-1">
                        <i class="bi bi-card-list"></i> Biển số: <span class="fw-bold" th:text="${car.licensePlate}"></span>
                    </p>
                    <p class="card-text text-danger fw-bold fs-5 mb-3">
                        <i class="bi bi-tags-fill"></i> <span th:text="${#numbers.formatDecimal(car.pricePerDay, 0, 'COMMA', 0, 'POINT')}"></span> VNĐ/ngày
                    </p>
                    <div class="mt-auto d-grid gap-2 d-sm-flex justify-content-sm-between">
                        <a th:href="@{/cars/{id}(id=${car.id})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-eye"></i> Xem chi tiết
                        </a>
                        <a th:if="${car.available}" th:href="@{/bookings/create/{carId}(carId=${car.id})}" class="btn btn-sm btn-primary">
                            <i class="bi bi-calendar-check"></i> Đặt ngay
                        </a>
                        <span th:unless="${car.available}" class="btn btn-sm btn-secondary disabled" aria-disabled="true">
                             <i class="bi bi-slash-circle"></i> Tạm hết xe
                         </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-warning mt-4" role="alert" th:if="${#lists.isEmpty(cars)}">
        <i class="bi bi-exclamation-triangle-fill"></i> Không tìm thấy xe nào phù hợp với yêu cầu của bạn.
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}" class="mt-5"></div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                                                                            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
                                                                            crossorigin="anonymous"></script>

</body>
</html>
