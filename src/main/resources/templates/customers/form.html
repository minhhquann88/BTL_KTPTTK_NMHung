<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle ?: 'Thông tin Khách hàng'}">Thông tin Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4">
    <h1 th:text="${pageTitle}">Thêm/Sửa Khách hàng</h1>
    <hr>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
    </div>

    <form th:object="${customerDTO}"
          th:action="${isEditMode ? '/admin/customers/edit/' + customerDTO.id : '/admin/customers/add'}"
          method="post"
          class="needs-validation" novalidate>

        <input type="hidden" th:if="${isEditMode}" th:field="*{id}" />

        <div class="row g-3">
            <div class="col-md-6 mb-3">
                <label for="fullName" class="form-label">Họ và tên <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                    Lỗi họ tên
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                    Lỗi email
                </div>
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="phoneNumber" class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" required pattern="^\d{10,11}$">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">
                    Lỗi số điện thoại
                </div>
            </div>

            <div class="col-12 mb-3">
                <label for="address" class="form-label">Địa chỉ</label>
                <textarea class="form-control" id="address" rows="3" th:field="*{address}"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">
                    Lỗi địa chỉ
                </div>
            </div>

            <div class="col-12 mb-3" th:if="${isEditMode}">
                <label class="form-label">Ngày đăng ký</label>
                <input type="text" class="form-control" th:value="${#temporals.format(customerDTO.registrationDate, 'dd/MM/yyyy HH:mm')}" disabled readonly>
            </div>

        </div>

        <hr class="my-4">

        <div class="d-flex justify-content-end">
            <a th:href="@{/admin/customers}" class="btn btn-secondary me-2">
                <i class="bi bi-x-circle"></i> Hủy bỏ
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i> Lưu thay đổi
            </button>
        </div>

    </form>

</main>

<div th:replace="~{fragments/footer :: footer}" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>
</body>
</html>
