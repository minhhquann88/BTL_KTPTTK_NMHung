<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle ?: 'Quản lý Khách hàng'}">Quản lý Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}"/> </head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${pageTitle}">Danh sách Khách hàng</h1>
        <a th:href="@{/admin/customers/add}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Thêm Khách hàng
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="@{/admin/customers}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" class="form-control" name="keyword" placeholder="Tìm kiếm theo tên khách hàng..." th:value="${keyword}">
            <button class="btn btn-outline-secondary" type="submit">
                <i class="bi bi-search"></i> Tìm kiếm
            </button>
            <a th:href="@{/admin/customers}" class="btn btn-outline-secondary" title="Hiển thị tất cả">
                <i class="bi bi-list-ul"></i>
            </a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Họ tên</th>
                <th scope="col">Email</th>
                <th scope="col">Số điện thoại</th>
                <th scope="col">Địa chỉ</th>
                <th scope="col">Ngày ĐK</th>
                <th scope="col">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(customers)}">
                <td colspan="7" class="text-center">Không tìm thấy khách hàng nào.</td>
            </tr>
            <tr th:each="customer : ${customers}">
                <th scope="row" th:text="${customer.id}">1</th>
                <td th:text="${customer.fullName}">Nguyễn Văn A</td>
                <td th:text="${customer.email}">a@example.com</td>
                <td th:text="${customer.phoneNumber}">090xxxxxxx</td>
                <td th:text="${customer.address}">123 Đường ABC</td>
                <td th:text="${#temporals.format(customer.registrationDate, 'dd/MM/yyyy HH:mm')}">01/01/2025 10:00</td>
                <td>
                    <a th:href="@{/admin/customers/edit/{id}(id=${customer.id})}" class="btn btn-sm btn-warning me-1" title="Sửa">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/admin/customers/delete/{id}(id=${customer.id})}"
                       class="btn btn-sm btn-danger"
                       title="Xóa"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa khách hàng này?');">
                        <i class="bi bi-trash3"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
